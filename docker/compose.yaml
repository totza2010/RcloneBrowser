# The image with the window (~2.5 GB). RB_MODE in docker/.env says what runs:
#
#   web       the web page only        http://localhost:19999
#   both      the web page and the window, streamed     https://localhost:3001
#             (the default)
#   desktop   the window only
#
# Never going to want the window? Use compose.lite.yaml instead: the same
# web page from an image a twelfth of the size. RB_MODE=web here is for when
# the window is wanted now and then -- change it to both and restart.
#
# The two files are one installation (same service, volumes, /config):
# stopping one and starting the other keeps everything.
#
#   cp docker/.env.example docker/.env   # every setting, explained
#   docker compose -f docker/compose.yaml up -d
#
# Build from this checkout instead of pulling:
#   docker compose -f docker/compose.yaml build

services:
  rclonebrowser:
    image: ${RB_IMAGE:-ghcr.io/totza2010/rclonebrowser}:${RB_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rclonebrowser
    ports:
      # Both bound to loopback so neither is on the network by accident. Put
      # a reverse proxy with TLS in front before exposing either.
      #
      # Windows reserves scattered port ranges for Hyper-V and refuses to bind
      # inside them, with a message about socket access permissions rather
      # than about the port being reserved. Set RB_WEB_PORT or RB_PORT if a
      # default is in one of them; "netsh interface ipv4 show
      # excludedportrange protocol=tcp" lists them.
      #
      # The application's own web interface and API. Nothing listens here in
      # desktop mode.
      - "${RB_BIND:-127.0.0.1}:${RB_WEB_PORT:-19999}:19999"
      # The streamed window, over HTTPS with a self-signed certificate.
      # Nothing listens here in web mode.
      - "${RB_BIND:-127.0.0.1}:${RB_PORT:-3001}:3001"
    environment:
      - RB_MODE=${RB_MODE:-both}
      # Match the owner of any host directory mounted below. Running as root
      # was the default once and left everything the container wrote owned by
      # root on the host.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Bangkok}
      # A user name and password for the streamed window. Without them the
      # stream is open to anyone who can reach its port, which with the
      # loopback binding above means anyone on this machine. They do nothing
      # in web mode: the web interface has its own sign-in.
      - CUSTOM_USER=${RB_STREAM_USER:-}
      - PASSWORD=${RB_STREAM_PASSWORD:-}
      # Which rclone to run, chosen when the container starts rather than
      # when the image is built. Either may be left empty: with both empty
      # the rclone in the image is used and nothing is fetched.
      #
      #   RB_RCLONE_REPO      tgdrive/rclone (teldrive) or rclone/rclone
      #   RB_RCLONE_VERSION   a version such as 1.75.0, or "latest"
      #
      # It is fetched once and kept in the /config volume, so changing these
      # and restarting is all a change of version takes, and a version
      # already fetched needs no network. "latest" asks GitHub at each start.
      - RB_RCLONE_REPO=${RB_RCLONE_REPO:-}
      - RB_RCLONE_VERSION=${RB_RCLONE_VERSION:-}
      # How far the page may look on this side: /media, where RB_MEDIA is
      # mounted, unless more is mounted and listed here.
      - RB_LOCAL_ROOTS=${RB_LOCAL_ROOTS:-/media}
      # Each of these, left empty, is the program's own setting -- changed on
      # the page or in Preferences. Set here, it is fixed there.
      - RB_RCLONE_LOG_LEVEL=${RB_RCLONE_LOG_LEVEL:-}
      - RB_STREAM_IDLE_MINUTES=${RB_STREAM_IDLE_MINUTES:-}
      - RB_WATCH_POLL_SECONDS=${RB_WATCH_POLL_SECONDS:-}
      - RB_UPLOAD_STAGING=${RB_UPLOAD_STAGING:-}
      - RB_DEBUG=${RB_DEBUG:-}
      # An rclone.conf kept encrypted: its password, so rclone can open it.
      - RCLONE_CONFIG_PASS=${RCLONE_CONFIG_PASS:-}
      # Wayland instead of X11 for the streamed window. X11 is the default
      # and the better-trodden path.
      # - PIXELFLUX_WAYLAND=true
    # The streaming stack shares frames through /dev/shm and the default of
    # 64 MB is not enough for it. Unused in web mode.
    shm_size: 1gb
    # "docker stop" waits ten seconds by default before killing. The
    # application takes up to eight to stop its transfers and record what
    # became of them, and the supervisor around it needs a little as well.
    stop_grace_period: 20s
    # Up again after a reboot or a crash, mounts set to start with it as well.
    restart: ${RB_RESTART:-unless-stopped}
    volumes:
      # rclone.conf, saved tasks, the scheduler, and the per-job logs.
      #
      # A named volume by default, because a host path that works on both
      # Windows and Linux cannot be written literally here, and because Docker
      # manages ownership for us. Point RB_CONFIG at a directory to use one
      # instead -- for example to carry on using an existing rclone.conf:
      #
      #   RB_CONFIG=/home/you/.config/rclone      (Linux/macOS)
      #   RB_CONFIG=C:\Users\you\AppData\Roaming\rclone   (Windows)
      #
      # Compose reads anything that is not a path as a volume name, so the
      # default below is the named volume declared at the bottom of this file.
      - "${RB_CONFIG:-rclonebrowser-config}:/config"

      # What the application can see to transfer. Defaults to a named volume
      # so it works out of the box; point RB_MEDIA at a directory to reach
      # real files.
      - "${RB_MEDIA:-rclonebrowser-media}:/media"

      # Wherever rclone already keeps its configuration on this machine, so
      # the remotes you have set up are simply there. Resolved per platform:
      #
      #   Windows            the rclone folder under %APPDATA%
      #   Linux and macOS    $HOME/.config/rclone
      #
      # The container uses this rclone.conf if it finds one and otherwise
      # falls back to the /config volume, creating it there. Nothing here is
      # overwritten either way.
      #
      # The directory is mounted rather than the file: rclone saves by writing
      # a new file and renaming it over the old one, which a single-file bind
      # mount cannot do -- the save fails with "device or resource busy" and
      # every remote added through the interface is lost on restart.
      #
      # Set RB_RCLONE_CONF to point somewhere else.
      - "${RB_RCLONE_CONF:-${APPDATA:-$HOME/.config}/rclone}:/rclone-config"

      # An rclone from outside the image, for staying on a build you already
      # run. Must be a Linux binary of this architecture, so on Windows it
      # means supplying a Linux rclone rather than the installed one.
      # - "/usr/local/bin/rclone:/opt/rclone/rclone:ro"

    # rclone mount needs FUSE. Left out because it widens what a compromised
    # container can do and transfers do not need it. Uncomment to mount:
    # devices:
    #   - /dev/fuse
    # cap_add:
    #   - SYS_ADMIN
    # security_opt:
    #   - apparmor:unconfined

volumes:
  rclonebrowser-config:
  rclonebrowser-media:
