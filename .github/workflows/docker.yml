name: Docker image

# Kept out of ci.yml so it only runs when it could actually break: it
# compiles the application a second time, inside the image.
on:
  push:
    branches: ['**']
    paths:
      - 'docker/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'docker/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.dockerignore'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rclonebrowser

jobs:
  build:
    name: Build image (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only used by the publish step, which is skipped except on a tag.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # tgdrive's fork, for the teldrive backend. The default, and what
          # the unsuffixed moving tag points at.
          - name: tgdrive
            repo: tgdrive/rclone
            moving: latest
            expect_teldrive: 'yes'
          # Mainline rclone, for anyone who does not need teldrive. The fork
          # trails mainline by a release or two, so this is the newer rclone.
          - name: rclone
            repo: rclone/rclone
            moving: latest-mainline
            expect_teldrive: 'no'

    steps:
      - uses: actions/checkout@v4

      # Resolved here rather than inside the build, so the version can go into
      # the tag. docker-rclone-watch.yml does the same, and the two produce
      # identical tag names.
      - name: Find the newest ${{ matrix.repo }} release
        id: rclone
        run: |
          version="$(gh api "repos/${{ matrix.repo }}/releases/latest" --jq .tag_name | sed 's/^v//')"
          [ -n "$version" ] || { echo "could not resolve ${{ matrix.repo }}" >&2; exit 1; }
          echo "rclone is at $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Image tags say what is inside them: which application release, which
      # rclone, and which version of it.
      #
      #   3.1.1-tgdrive-1.73.1   exact, never moves
      #   tgdrive-1.73.1         that rclone, newest application release
      #   latest                 newest of both
      #
      # The application version comes from the VERSION file, so a build off a
      # branch is labelled with the version it would release as.
      - name: Work out the tags
        id: tags
        run: |
          app="$(tr -d '[:space:]' < VERSION)"
          rc="${{ steps.rclone.outputs.version }}"
          {
            echo "exact=${{ env.IMAGE }}:${app}-${{ matrix.name }}-${rc}"
            echo "byrclone=${{ env.IMAGE }}:${{ matrix.name }}-${rc}"
            echo "moving=${{ env.IMAGE }}:${{ matrix.moving }}"
          } >> "$GITHUB_OUTPUT"
          echo "application $app, rclone $rc"

      - uses: docker/setup-buildx-action@v3

      # Both variants share the stage that compiles the application, so the
      # second one costs little beyond downloading a different rclone.
      #
      # Built and loaded first so the check below runs against what would be
      # published rather than a second build of it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci-${{ matrix.name }}
          build-args: |
            RCLONE_REPO=${{ matrix.repo }}
            RCLONE_VERSION=${{ steps.rclone.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # A container that starts but has no rclone, or a binary missing a
      # shared library, would otherwise only show up when someone runs it.
      - name: Check the image has what it needs
        run: |
          docker run --rm --entrypoint /bin/sh \
              ${{ env.IMAGE }}:ci-${{ matrix.name }} -c '
            set -eu
            cat /etc/rclone-source
            test -x /usr/bin/rclone-browser
            if ldd /usr/bin/rclone-browser | grep "not found"; then
              echo "missing shared libraries" >&2
              exit 1
            fi

            # The whole point of the two variants: each must carry the
            # backend set it claims to.
            if rclone help backends | grep -q teldrive; then have=yes; else have=no; fi
            if [ "$have" != "${{ matrix.expect_teldrive }}" ]; then
              echo "expected teldrive=${{ matrix.expect_teldrive }}, got $have" >&2
              exit 1
            fi

            # The version in the tag is the version that arrived.
            got="$(rclone version | head -1 | awk "{print \$2}" | sed "s/^v//")"
            if [ "$got" != "${{ steps.rclone.outputs.version }}" ]; then
              echo "asked for ${{ steps.rclone.outputs.version }}, got $got" >&2
              exit 1
            fi

            echo "image looks complete"
          '

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published only from a version tag. Ordinary pushes build and check
      # without publishing anything.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.exact }}
            ${{ steps.tags.outputs.byrclone }}
            ${{ steps.tags.outputs.moving }}
          build-args: |
            RCLONE_REPO=${{ matrix.repo }}
            RCLONE_VERSION=${{ steps.rclone.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Say what happened
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo "- rclone: \`${{ matrix.repo }} v${{ steps.rclone.outputs.version }}\`"
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "- published:"
              echo "  - \`${{ steps.tags.outputs.exact }}\`"
              echo "  - \`${{ steps.tags.outputs.byrclone }}\`"
              echo "  - \`${{ steps.tags.outputs.moving }}\`"
            else
              echo "- built and checked, not published"
              echo "- would have been \`${{ steps.tags.outputs.exact }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
