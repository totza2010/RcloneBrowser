name: Docker image

# Kept out of ci.yml so it only runs when it could actually break: it
# compiles the application a second time, inside the image.
on:
  push:
    branches: ['**']
    paths:
      - 'docker/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'docker/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.dockerignore'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rclonebrowser
  # The branch whose every push is published as the dev images: what is
  # being worked on, to pull and try before a release.
  DEV_BRANCH: modernize/rc-progress-and-hardening

jobs:
  build:
    name: Build image (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only used by the publish steps: on a version tag, and on a push to
      # DEV_BRANCH (the dev images).
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # tgdrive's fork, for the teldrive backend. The default, and what
          # the unsuffixed moving tag points at.
          - name: tgdrive
            repo: tgdrive/rclone
            moving: latest
            expect_teldrive: 'yes'
          # Mainline rclone, for anyone who does not need teldrive. The fork
          # trails mainline by a release or two, so this is the newer rclone.
          - name: rclone
            repo: rclone/rclone
            moving: latest-mainline
            expect_teldrive: 'no'

    steps:
      - uses: actions/checkout@v4

      # Resolved here rather than inside the build, so the version can go into
      # the tag. docker-rclone-watch.yml does the same, and the two produce
      # identical tag names.
      - name: Find the newest ${{ matrix.repo }} release
        id: rclone
        run: |
          version="$(gh api "repos/${{ matrix.repo }}/releases/latest" --jq .tag_name | sed 's/^v//')"
          [ -n "$version" ] || { echo "could not resolve ${{ matrix.repo }}" >&2; exit 1; }
          echo "rclone is at $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Image tags say what is inside them: which application release, which
      # rclone, and which version of it.
      #
      #   3.1.1-tgdrive-1.73.1   exact, never moves
      #   tgdrive-1.73.1         that rclone, newest application release
      #   latest                 newest of both
      #
      # The application version comes from the VERSION file, so a build off a
      # branch is labelled with the version it would release as.
      - name: Work out the tags
        id: tags
        run: |
          app="$(tr -d '[:space:]' < VERSION)"
          rc="${{ steps.rclone.outputs.version }}"
          {
            echo "exact=${{ env.IMAGE }}:${app}-${{ matrix.name }}-${rc}"
            echo "byrclone=${{ env.IMAGE }}:${{ matrix.name }}-${rc}"
            echo "moving=${{ env.IMAGE }}:${{ matrix.moving }}"
          } >> "$GITHUB_OUTPUT"
          echo "application $app, rclone $rc"

      # What this run publishes: a release (a v* tag), the dev images (a push
      # to DEV_BRANCH, or run by hand from it), or nothing. A pull request
      # never publishes.
      - name: Publish what
        id: publish
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "kind=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "pull_request" ] && \
               [ "${{ github.ref }}" = "refs/heads/${{ env.DEV_BRANCH }}" ]; then
            echo "kind=dev" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi
          # dev, dev-web for tgdrive (the default, as latest is); the mainline
          # variant carries its name. And the commit, to go back to one.
          sha="$(echo "${{ github.sha }}" | cut -c1-7)"
          base="dev"
          [ "${{ matrix.name }}" = "tgdrive" ] || base="dev-mainline"
          echo "dev=${{ env.IMAGE }}:${base}" >> "$GITHUB_OUTPUT"
          echo "devsha=${{ env.IMAGE }}:${base}-${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Both variants share the stage that compiles the application, so the
      # second one costs little beyond downloading a different rclone.
      #
      # Built and loaded first so the check below runs against what would be
      # published rather than a second build of it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci-${{ matrix.name }}
          build-args: |
            RCLONE_REPO=${{ matrix.repo }}
            RCLONE_VERSION=${{ steps.rclone.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # A container that starts but has no rclone, or a binary missing a
      # shared library, would otherwise only show up when someone runs it.
      - name: Check the image has what it needs
        run: |
          docker run --rm --entrypoint /bin/sh \
              ${{ env.IMAGE }}:ci-${{ matrix.name }} -c '
            set -eu
            cat /etc/rclone-source
            test -x /usr/bin/rclone-browser
            if ldd /usr/bin/rclone-browser | grep "not found"; then
              echo "missing shared libraries" >&2
              exit 1
            fi

            # The whole point of the two variants: each must carry the
            # backend set it claims to.
            if rclone help backends | grep -q teldrive; then have=yes; else have=no; fi
            if [ "$have" != "${{ matrix.expect_teldrive }}" ]; then
              echo "expected teldrive=${{ matrix.expect_teldrive }}, got $have" >&2
              exit 1
            fi

            # The version in the tag is the version that arrived.
            got="$(rclone version | head -1 | awk "{print \$2}" | sed "s/^v//")"
            if [ "$got" != "${{ steps.rclone.outputs.version }}" ]; then
              echo "asked for ${{ steps.rclone.outputs.version }}, got $got" >&2
              exit 1
            fi

            echo "image looks complete"
          '

      - name: Log in to ghcr.io
        if: steps.publish.outputs.kind != 'none'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The web-only image (target web): the daemon and its page, no window,
      # about a tenth of the size. Built and checked on every push like the
      # one above; published beside it with "-web" on each tag.
      - name: Build the web-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci-${{ matrix.name }}-web
          build-args: |
            RCLONE_REPO=${{ matrix.repo }}
            RCLONE_VERSION=${{ steps.rclone.outputs.version }}

      - name: Check the web-only image
        run: |
          docker run --rm --entrypoint /bin/sh \
              ${{ env.IMAGE }}:ci-${{ matrix.name }}-web -c '
            set -eu
            test -x /usr/bin/rclone-browser
            if ldd /usr/bin/rclone-browser | grep "not found"; then
              echo "missing shared libraries" >&2
              exit 1
            fi
            # No window in it at all: nothing of QtWidgets linked.
            if ldd /usr/bin/rclone-browser | grep -q Widgets; then
              echo "the web-only program links QtWidgets" >&2
              exit 1
            fi
            # The user's, as on the other image: a new volume takes the owner
            # of the folder it is mounted over, and a root /media was one
            # nothing could be downloaded into.
            for folder in /config /media; do
              if [ "$(stat -c %U "$folder")" != abc ]; then
                echo "$folder is not the user's" >&2
                exit 1
              fi
            done
            rclone version | head -1
            /usr/bin/rclone-browser --help > /dev/null
          '

      # The dev images: the ones just built and checked, pushed as they are.
      # amd64 only -- arm64 is built by emulation and takes the better part of
      # an hour, which a release is worth and a push is not.
      - name: Publish the dev images
        if: steps.publish.outputs.kind == 'dev'
        run: |
          set -eu
          for suffix in "" "-web"; do
            built="${{ env.IMAGE }}:ci-${{ matrix.name }}${suffix}"
            for tag in "${{ steps.publish.outputs.dev }}${suffix}" "${{ steps.publish.outputs.devsha }}${suffix}"; do
              docker tag "$built" "$tag"
              docker push "$tag"
            done
          done

      # arm64 is built by emulation, so only for what is published: a Raspberry
      # Pi or an ARM NAS pulls the same tag and gets its own image. Slow --
      # every source file compiled under QEMU -- which is why ordinary pushes
      # build and check amd64 alone.
      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          platforms: arm64

      # Published only from a version tag. Ordinary pushes build and check
      # without publishing anything.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.exact }}
            ${{ steps.tags.outputs.byrclone }}
            ${{ steps.tags.outputs.moving }}
          build-args: |
            RCLONE_REPO=${{ matrix.repo }}
            RCLONE_VERSION=${{ steps.rclone.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Publish the web-only image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.exact }}-web
            ${{ steps.tags.outputs.byrclone }}-web
            ${{ steps.tags.outputs.moving }}-web
          build-args: |
            RCLONE_REPO=${{ matrix.repo }}
            RCLONE_VERSION=${{ steps.rclone.outputs.version }}

      - name: Say what happened
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo "- rclone: \`${{ matrix.repo }} v${{ steps.rclone.outputs.version }}\`"
            if [ "${{ steps.publish.outputs.kind }}" = "release" ]; then
              echo "- published:"
              echo "  - \`${{ steps.tags.outputs.exact }}\`"
              echo "  - \`${{ steps.tags.outputs.byrclone }}\`"
              echo "  - \`${{ steps.tags.outputs.moving }}\`"
            elif [ "${{ steps.publish.outputs.kind }}" = "dev" ]; then
              echo "- published (dev, amd64):"
              echo "  - \`${{ steps.publish.outputs.dev }}\` and \`-web\`"
              echo "  - \`${{ steps.publish.outputs.devsha }}\` and \`-web\`"
            else
              echo "- built and checked, not published"
              echo "- would have been \`${{ steps.tags.outputs.exact }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
